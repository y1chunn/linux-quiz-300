play:none}.result{text-align:center}.score{font-size:56px;font-weight:900;margin:8px}.result p{font-size:18px}.footer{text-align:center;color:#94a3b8;margin-top:18px;font-size:13px}.jump{display:flex;gap:8px;align-items:center;margin-top:12px}.jump input{width:100px;padding:9px;border:1px solid #d1d5db;border-radius:10px}@media(max-width:600px){.wrap{padding:12px}.top,.card{padding:18px}.q{font-size:18px}.actions{position:sticky;bottom:8px;background:#ffffffee;padding-top:8px}.btn{flex:1}}</style><style id="mobile-final">

</style></head><body><div class="wrap"><div class="top"><h1>🐧 Linux 300 題逐題測驗</h1><div class="sub">完整 300 題・依 PDF 原順序・每題作答後立即顯示答案</div><div class="bar"><span class="pill" id="counter">準備開始</span><span class="pill" id="scoreLive">目前 0 分</span></div><div class="progress"><div id="progress"></div></div></div><div class="card" id="start"><h2>準備好開始了嗎？</h2><p>這版不會隨機抽題，會按照 PDF 的 1-01 → 8-30 順序完整做完 300 題。單選題或複選題送出後，都會立刻顯示正確答案。</p><button class="btn primary" onclick="start()">開始測驗</button></div><div class="card hidden" id="quiz"><div class="qno" id="qno"></div><div class="q" id="question"></div><div class="opts" id="options"></div><div id="feedback"></div><div class="actions"><button class="btn secondary" id="prev" onclick="prevQ()">← 上一題</button><button class="btn primary" id="submit" onclick="submitAnswer()">送出答案 ✓</button><button class="btn primary" id="next" onclick="nextQ()">下一題 →</button></div></div><div class="card result hidden" id="result"><h2>🎉 300 題完成！</h2><div class="score" id="finalScore"></div><p id="resultText"></p><div class="jump"><input id="jump" type="number" min="1" max="300" placeholder="題號 1-300"><button class="btn secondary" onclick="jumpTo()">跳到題目</button></div><div class="actions"><button class="btn primary" onclick="location.reload()">重新開始</button></div><div class="review" id="review"></div></div><div class="footer">題庫來源：你提供的 Linux.pdf，共 300 題</div></div><script>const BANK=[{"id": "1-01", "question": "Boot Loader 於開機時會讀取的系統核⼼為下列哪⼀項?", "options": ["/boot/kernel", "/boot/vmlinuz", "/boot/system", "/boot/initrd.img"], "answer": "B", "multi": false}, {"id": "1-02", "question": "在/etc/inittab 檔案中，不應將預設的 Run Level 設定為下列哪些值? (複選)", "options": ["0", "1", "4", "6"], "answer": "ACD", "multi": true}, {"id": "1-03", "question": "下列哪⼀個⽬錄中的檔案，是開機時 Kernel 依據⽬前執行環境自動產生 的?", "options": ["/temp", "/opt", "/root", "/proc"], "answer": "D", "multi": false}, {"id": "1-04", "question": "想要看電腦所有磁碟與其掛載點，可使用下列哪些指令? (複選)", "options": ["du", "mount", "fdisk", "df"], "answer": "BD", "multi": true}, {"id": "1-05", "question": "關於 Linux 的敘述，下列哪⼀項錯誤?", "options": ["Linux 遵循 POSIX 的標準開發與現今 System V 及 BSD 等 Unix 相容", "無法安裝於筆記型電腦，只能裝於桌上型 PC 及網路伺服器", "Linux 提供非常完善網路功能", "Linux 是多人多工的作業系統"], "answer": "B", "multi": false}, {"id": "1-06", "question": "登入 root 管理者帳戶後出現提示字元[root@localhost ~]# ，請問提示 字元中的[/root]是指下列哪些項⽬? (複選)", "options": ["⽬前所有工作⽬錄", "帳戶登入名稱", "管理者名稱", "管理者家⽬錄"], "answer": "AD", "multi": true}, {"id": "1-07", "question": "下列哪⼀項指令，可以察看⽬前開機屬於哪⼀個 Run Level?", "options": ["level", "run level", "telinit", "runlevel"], "answer": "D", "multi": false}, {"id": "1-08", "question": "下列哪些指令可以將 Run Level 更改至 Run Level 3? (複選)", "options": ["init 3", "Runlevel 3", "telinit 3", "runlevel 3"], "answer": "AC", "multi": true}, {"id": "1-09", "question": "在 systemd 程序下，若要變更或增加⼀個 system 服務的相關參數，下 列敘述哪⼀項正確?", "options": ["加入命令於/etc/systemd/system 其優先權低於/lib/systemd/system", "/etc/systemd/system 與/lib/systemd/system 的內容必須相同", "加入命令於/etc/systemd/system 其優先權高於/lib/systemd/system", "/lib/systemd/system 為/etc/systemd/system 的符號連結"], "answer": "C", "multi": false}, {"id": "1-10", "question": "安裝 Linux 時，下列哪⼀項⼀定要切成單獨分割區的掛載點?", "options": ["Swap", "/tmp", "/var", "/usr"], "answer": "A", "multi": false}, {"id": "1-11", "question": "下列哪些指令可用來登出系統? (複選)", "options": ["logout", "quit", "reset", "exit"], "answer": "AD", "multi": true}, {"id": "1-12", "question": "加掛了⼀個新硬碟/dev/hdb，請問 fdisk 完成後重新開機，可使用下列 那些方式格式化/dev/hdb1 分割區成 ext3 日誌檔案系統? (複選)", "options": ["format /dev/hdb1", "mkfs –t ext3 /dev/hdb1", "mke2fs –j /dev/hdb1", "mkformat –t ext3 /dev/hdb1"], "answer": "BC", "multi": true}, {"id": "1-13", "question": "安裝新的硬碟分割區/dev/hdb1 後，要開機時自動掛載/dev/hdb1，需 要在下列哪⼀項檔案中設定自動掛載?", "options": ["/etc/inittab", "/etc/fstab", "/var/disktab", "/usr/ disktab"], "answer": "B", "multi": false}, {"id": "1-14", "question": "若欲掛載光碟片，下列哪⼀種指令最為標準及正確?", "options": ["mount /mnt/cdrom", "mount –t iso9660 /dev/cdrom/mnt/cdrom", "mount /dev/cdrom", "mount /mnt/cdrom /dev/cdrom"], "answer": "B", "multi": false}, {"id": "1-15", "question": "下列哪⼀項是列印檔案的指令?", "options": ["lpp readme.txt", "lpq readme.txt", "lpd readme.txt", "lpr readme.txt"], "answer": "D", "multi": false}, {"id": "1-16", "question": "下列哪⼀位為 Linux 作業系統核⼼的創始人?", "options": ["Bill Gates", "Linus Torvalds", "Michael Jordan", "Randy Johnson"], "answer": "B", "multi": false}, {"id": "1-17", "question": "Linux 可安裝於下列哪些硬體架構之上?(複選)", "options": ["Intel x86", "Sparc", "Alpha", "PowerPC"], "answer": "ABCD", "multi": true}, {"id": "1-18", "question": "關於 Run Level 的敘述，下列哪⼀項錯誤?", "options": ["Run Level 0 為重新開機(Reboot)", "Run Level 1 為單人使用者模式(Single User Mode)", "Run Level 3 為多人使用者模式(Multi User Mode)", "Run Level 5 為 X Window 模式，開機直接進入 X Window 環境"], "answer": "A", "multi": false}, {"id": "1-19", "question": "關於系統啟動 Script 的敘述，下列哪⼀項錯誤?", "options": ["系統啟動時所執行的 Script ， 通常存放於/etc/rc.d 之下的不同子⽬錄", "存放於/etc/rc.d/rc3.d ⽬錄之下的 Script，將於系統啟動於 Run Level 3 時執行", "若該 Script 的名稱為 S 開頭 ， 例如:S10network ， 則代表進入該 Run Level 時會啟動的 Script", "若該 Script 的名稱為 H 開頭，例如:H70nfsd，則代表進入該 Run Level 時會停止的 Script"], "answer": "D", "multi": false}, {"id": "1-20", "question": "若將系統啟動至單人模式(Single User Mode) ，下列哪⼀個⽬錄所定義 的 Script 會被執行?", "options": ["/etc/rc0.d 或/etc/rc.d/rc0.d", "/etc/rc1.d 或 /etc/rc.d/rc1.d", "/etc/rc2.d 或 /etc/rc.d/rc2.d", "/etc/rc3.d 或 /etc/rc.d/rc3.d"], "answer": "B", "multi": false}, {"id": "1-21", "question": "下列哪⼀項指令 ， 可以得知系統主機板所使用晶片組及控制器之廠牌及型 號?", "options": ["lspci", "getpci", "showpci", "Pciinfo"], "answer": "A", "multi": false}, {"id": "1-22", "question": "下列哪⼀項指令，可以在終端機的文字視窗下，捲回至先前的頁面， 以 便檢視各種開機資訊及錯誤訊息?", "options": ["Alt-PageUp/PageDown", "Ctrl-PageUp/PageDown", "Shift-PageUp/PageDown", "Tab-PageUp/PageDown"], "answer": "C", "multi": false}, {"id": "1-23", "question": "若使用 shutdown -F now 進行關機，會出現下列哪⼀項狀況?", "options": ["下次啟動時進行 fsck", "下次啟動時不進行 fsck", "下次啟動時將會快速啟動", "加快關機速度"], "answer": "D", "multi": false}, {"id": "1-24", "question": "下列哪⼀項指令，可以顯示⽬前系統所使用之 IRQ 狀態?", "options": ["cat /proc/interrupts", "cat /p ssList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render()}function render(){const q=BANK[idx];document.getElementById('qno').textContent=`第 ${idx+1} / ${BANK.length} 題　｜　題庫編號 ${q.id}${q.multi?'　｜　複選題':''}`;document.getElementById('question').textContent=q.question;document.getElementById('counter').textContent=`第 ${idx+1} / ${BANK.length} 題`;document.getElementById('scoreLive').textContent=`目前 ${calcScore()} 分`;document.getElementById('progress').style.width=((idx+1)/BANK.length*100)+'%';const box=document.getElementById('options');box.innerHTML='';const selected=answers[idx]||[];q.options.forEach((text,i)=>{const L='ABCD'[i],label=document.createElement('label');label.className='opt';label.innerHTML=`<input type="${q.multi?'checkbox':'radio'}" name="answer" value="${L}" ${selected.includes(L)?'checked':''} ${submitted[idx]?'disabled':''}><span class="letter">(${L})</span><span>${escapeHtml(text)}</span>`;label.querySelector('input').addEventListener('change',save);box.appendChild(label)});if(submitted[idx])showResult();else document.getElementById('feedback').innerHTML='';document.getElementById('prev').disabled=idx===0;document.getElementById('next').disabled=!submitted[idx];document.getElementById('next').textContent=idx===BANK.length-1?'查看成績 ✓':'下一題 →';document.getElementById('submit').disabled=selected.length===0;document.getElementById('submit').classList.toggle('hidden',submitted[idx])}function save(){answers[idx]=[...document.querySelectorAll('input[name=answer]:checked')].map(x=>x.value).sort();document.getElementById('submit').disabled=answers[idx].length===0;document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('selected',x.querySelector('input').checked));}function submitAnswer(){save();if(!(answers[idx]||[]).length)return;submitted[idx]=true;render()}function showResult(){const q=BANK[idx],user=answers[idx]||[],ok=user.join('')===q.answer;document.querySelectorAll('.opt').forEach((el,i)=>{const L='ABCD'[i],input=el.querySelector('input');if(q.answer.includes(L))el.classList.add('correct');else if(user.includes(L))el.classList.add('wrong')});document.getElementById('feedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}">${ok?'✅ 答對了！':'❌ 答錯了！'}　正確答案：${q.answer.split('').join('、')}<div class="explain">${q.multi?'這題為複選題，需全部選對才算答對。':''}</div></div>`}function nextQ(){if(!submitted[idx])return;if(idx<BANK.length-1){idx++;render()}else finish()}function prevQ(){if(idx>0){idx--;render()}}function calcScore(){let n=0;BANK.forEach((q,i)=>{if(submitted[i]&&(answers[i]||[]).join('')===q.answer)n++});return Math.round(n/BANK.length*100)}function finish(){document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');const score=calcScore();document.getElementById('finalScore').textContent=score+' / 100 分';document.getElementById('resultText').textContent=`已完成 ${BANK.length} 題，答對 ${Math.round(score*BANK.length/100)} 題。`;const review=document.getElementById('review');review.innerHTML='';BANK.forEach((q,i)=>{const ok=(answers[i]||[]).join('')===q.answer;const d=document.createElement('div');d.className='review-item '+(ok?'correct':'wrong');d.innerHTML=`<b>${i+1}. ${escapeHtml(q.question)}</b><div class="ans">你的答案：${(answers[i]||[]).join('、')||'未作答'}　｜　正確答案：${q.answer.split('').join('、')}　${ok?'✅':'❌'}</div>`;review.appendChild(d)})}function jumpTo(){let n=parseInt(document.getElementById('jump').value,10);if(n>=1&&n<=BANK.length){idx=n-1;document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render()}}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
